<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Círculo Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #12141c; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center;
    background: rgba(10,12,18,.88); color: #fff; text-align: center; gap: 12px; overflow-y: auto;
    padding: 28px 16px; box-sizing: border-box;
  }
  .screen h1 { margin: 0; }
  .screen p { margin: 0; }
  button {
    padding: 12px 28px; font-size: 18px; border: 0; border-radius: 8px;
    background: #4cc9f0; color: #0b1020; cursor: pointer; font-weight: 700;
  }
  button:hover:not(:disabled) { background: #7ad9f5; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.sec { background: #3a4156; color: #fff; }
  button.sec:hover:not(:disabled) { background: #4a526b; }
  button.on { background: #4ade80; color: #0b1020; opacity: 1; }
  #over, #pause { justify-content: center; }
  #over h1 { font-size: 48px; color: #ff5d6c; }
  #over p { font-size: 20px; }
  #over p.rec { color: #ffd23f; font-weight: 700; }
  .badge {
    display: none; width: 96px; height: 96px; border-radius: 50%; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, #fde68a, #f59e0b 70%); border: 5px solid #fff;
    font-size: 52px; color: #7c2d12; box-shadow: 0 0 26px rgba(245,158,11,.6);
  }
  #pause h1 { font-size: 48px; color: #4cc9f0; }
  #pause .hint { font-size: 14px; color: rgba(255,255,255,.6); }
  .row { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  #menu h1 { font-size: 52px; color: #4cc9f0; }
  #menu .coins { font-size: 24px; color: #ffd23f; }
  #menu .hint { font-size: 14px; color: rgba(255,255,255,.6); }
  #play { font-size: 22px; padding: 14px 42px; }
  .tabs { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .tabs button { min-width: 100px; font-size: 16px; padding: 10px 14px; }
  #shop, #pauseSettings { width: min(600px, 100%); display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  #shop h2 { margin: 14px 0 2px; font-size: 22px; color: #fff; text-align: left; border-bottom: 1px solid #2c3247; padding-bottom: 4px; }
  .upg {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: #1d2130; border-radius: 10px; padding: 10px 14px; text-align: left;
  }
  .upg .info b { display: block; font-size: 16px; }
  .upg .info span { font-size: 13px; color: rgba(255,255,255,.65); }
  .upg button { font-size: 15px; padding: 8px 16px; min-width: 130px; }
  .upg .val { font-size: 18px; font-weight: 700; color: #ffd23f; }
  .upg input[type=range] { width: 200px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="over" class="screen">
  <h1 id="overTitle">Has caído</h1>
  <div id="badge" class="badge">★</div>
  <p id="badgeLabel" class="rec"></p>
  <p id="stats"></p>
  <p id="records" class="rec"></p>
  <div class="row">
    <button id="again">Jugar otra vez (R)</button>
    <button id="infinite" style="display:none">Modo infinito</button>
    <button id="toMenu" class="sec">Menú y mejoras</button>
  </div>
</div>

<div id="pause" class="screen">
  <h1>Pausa</h1>
  <p class="hint">Pulsa Esc para continuar</p>
  <div id="pauseSettings"></div>
  <div class="row">
    <button id="resume">Continuar</button>
    <button id="quit" class="sec">Salir al menú</button>
  </div>
</div>

<div id="menu" class="screen">
  <h1>Círculo Arena</h1>
  <p class="coins">Monedas totales: <b>● <span id="totalCoins">0</span></b></p>
  <button id="play">Empezar partida</button>
  <p class="hint" id="current"></p>
  <p class="hint">WASD: mover · Flechas o clic mantenido del ratón: disparar (dos flechas = diagonal) · Q / E: arma anterior / siguiente · 1 a 9: poderes · R, F, Espacio o clic derecho: ulti · Esc: pausa</p>
  <div class="tabs" id="tabs"></div>
  <div id="shop"></div>
</div>

const healable = o => !HEALERS.has(o.type) && o.type !== 'final3' && o.type !== 'final4';   // los robots hacen un 30% más de daño

    robGray:   { name: 'Robot gris',        hp: 600,  speed: 70,  size: 16, dmg: 15,  value: 35,  robot: true, color: '#a1a1aa', shape: 'poly:6' },     // cohetes teledirigidos; al morir suelta 3 drones

  },

// zoom: <1 = personajes más pequeños (se ve más mapa).  scale: tamaño del mundo respecto a lo que se ve (1 = sin cámara).
const MAPS = {
  classic: { name: 'Arena clásica',  zoom: 1, scale: 1,      layout: 'none',    diff: 'hard',   desc: 'El mapa de siempre: arena abierta del tamaño de la pantalla, sin obstáculos.' },
  test:    { name: 'Mapa de prueba', zoom: 1, scale: 1,      layout: 'test',    diff: 'easy',   desc: 'Arena del tamaño de la pantalla con muros y pilares.' },
  big:     { name: 'Mapa grande',    zoom: 1, scale: 10 / 6, layout: 'circles', diff: 'medium', desc: 'Mapa de 10x10 con vista de 6x6: la cámara sigue al jugador y se detiene en los bordes. Obstáculos circulares en zonas aleatorias.' }
};
// Dificultad de cada mapa: vida y daño de los enemigos, ritmo de las oleadas y máximo de enemigos por oleada
const DIFFS = {
  easy:   { name: 'Fácil',   hp: 0.7,  dmg: 0.7,  interval: 1.25, cap: 4 },
  medium: { name: 'Media',   hp: 0.85, dmg: 0.85, interval: 1.1,  cap: 5 },
  hard:   { name: 'Difícil', hp: 1,    dmg: 1,    interval: 1,    cap: 5 }
};
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// Los obstáculos se calculan en proporción al tamaño de la vista
function buildObstacles(id) {
  const m = MAPS[id];
  if (!m || m.layout === 'none') return [];
  const u = Math.min(VW, VH) / 10;
  if (m.layout === 'test') {
    const p = u * 1.4, t = u * 0.35;
    return [
      { x: WW * 0.20, y: WH * 0.25, w: p, h: p },
      { x: WW * 0.80 - p, y: WH * 0.25, w: p, h: p },
      { x: WW * 0.20, y: WH * 0.75 - p, w: p, h: p },
      { x: WW * 0.80 - p, y: WH * 0.75 - p, w: p, h: p },
      { x: WW * 0.5 - u * 1.5, y: WH * 0.16, w: u * 3, h: t },
      { x: WW * 0.5 - u * 1.5, y: WH * 0.84 - t, w: u * 3, h: t },
      { x: WW * 0.35, y: WH * 0.5 - u * 1.2, w: t, h: u * 2.4 },
      { x: WW * 0.65 - t, y: WH * 0.5 - u * 1.2, w: t, h: u * 2.4 }
    ];
  }
  // círculos repartidos por zonas aleatorias (la disposición cambia en cada partida), centro despejado
  const rnd = rng(mapSeed), c = u * 3.2, out = [];
  for (let gx = c; gx < WW - c; gx += c) for (let gy = c; gy < WH - c; gy += c) {
    if (rnd() > 0.5) continue;
    const n = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const r = u * (0.45 + rnd() * 0.6);
      const x = gx + (rnd() - 0.5) * c * 0.8, y = gy + (rnd() - 0.5) * c * 0.8;
      if (Math.hypot(x - WW / 2, y - WH / 2) < u * 3.5 + r) continue;
      out.push({ circle: true, cx: x, cy: y, r });
    }
  }
  return out;
}

(function migrate() {
  const lv = getLevels();
  let changed = false;
  if (lv.rate) {   // la mejora de cadencia se retiró: se devuelven las monedas
    let refund = 0;
    for (let i = 0; i < lv.rate; i++) refund += Math.round(40 * Math.pow(1.45, i));
    setTotal(getTotal() + refund);
    delete lv.rate; changed = true;
  }
  if (lv.dmg) {    // el daño general pasa a ser el daño de la pistola
    lv.dmg_pistol = Math.max(lv.dmg_pistol || 0, lv.dmg);
    delete lv.dmg; changed = true;
  }
  if (lv.vamp) {   // la curación por enemigo eliminado se retiró: se devuelven las monedas
    let refund = 0;
    for (let i = 0; i < lv.vamp; i++) refund += Math.round(80 * Math.pow(1.45, i));
    setTotal(getTotal() + refund);
    delete lv.vamp; changed = true;
  }
  for (const [id, base] of [['dmgall', 450], ['crit', 600]]) {   // mejoras retiradas: se devuelven las monedas
    if (lv[id]) {
      let refund = 0;
      for (let i = 0; i < lv[id]; i++) refund += Math.round(base * Math.pow(1.45, i));
      setTotal(getTotal() + refund);
      delete lv[id]; changed = true;
    }
  }
  if (lv.r_quint) { setTotal(getTotal() + 300000); delete lv.r_quint; changed = true; }   // mejora retirada: se devuelven las monedas
  if (lv.armor > 15) {   // la armadura ahora llega al 45 %: se devuelven las monedas de los niveles sobrantes
    let refund = 0;
    for (let i = 15; i < lv.armor; i++) refund += Math.round(70 * Math.pow(1.32, i) * (i >= 10 ? 2.5 : 1));
    setTotal(getTotal() + refund); lv.armor = 15; changed = true;
  }
  if (lv.l_dmg2) { setTotal(getTotal() + 4000); delete lv.l_dmg2; changed = true; }   // mejora retirada: se devuelven las monedas
  const CAPS = { iframes: 4, f_range: 7, f_width: 5, f_cool: 5, f_vent: 5, l_rate: 4 };

})();

function audio() {
  if (!SND.ctx) {
    try { SND.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();
  return SND.ctx;
}
function tone(freq, dur, o) {
  o = o || {};
  const c = audio(); if (!c) return;
  const v = (o.vol === undefined ? 0.2 : o.vol) * SND.vol;
  if (v < 0.0005) return;
  const t0 = c.currentTime + (o.delay || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, o) {
  o = o || {};
  const c = audio(); if (!c) return;
  const v = (o.vol === undefined ? 0.2 : o.vol) * SND.vol;
  if (v < 0.0005) return;
  const t0 = c.currentTime + (o.delay || 0);
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.freq || 2000;
  const g = c.createGain();
  g.gain.setValueAtTime(v, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0);
}

const keys = {};
const ARROWS = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
// nombre de la tecla según su posición física (no cambia con mayúsculas, Bloq Mayús ni distribución del teclado)
function kname(e) {
  const c = e.code || '';
  if (c.startsWith('Key')) return c.slice(3).toLowerCase();
  if (c.startsWith('Arrow')) return c.toLowerCase();
  if (c === 'Space') return ' ';
  return e.key.toLowerCase();
}
const GAME_KEYS = new Set(['w', 'a', 's', 'd', 'q', 'e', 'r', 'f', 'i', 'j', 'k', 'l', ' ', ...ARROWS]);
addEventListener('keydown', e => {
  const k = kname(e);
  if (k === 'escape') { togglePause(); e.preventDefault(); return; }
  keys[k] = true;
  if (k === 'r' && state.over) { start(); return; }
  if (e.key === 'Enter' && inMenu) start();
  if (!inMenu && !state.over && !state.paused) {
    if (!e.repeat) {
      if (k === 'q') cycleWeapon(-1);              // arma anterior
      else if (k === 'e') cycleWeapon(1);          // arma siguiente
      else if (k === 'shift' && stats.weapon === 'sword') { const n = swModes(WEAPONS.sword.stats(stats.lv)).length; state.swMode = ((state.swMode || 0) + 1) % n; }   // cambia el ataque de la espada
      else if (k === 'r' || k === 'f' || k === ' ') useUlt();   // ulti del arma (R, F o Espacio: así no hace falta R si el teclado no registra tantas teclas)
      else { const p = POWERS.find(p => p.key === e.key); if (p) usePower(p); }
    }
    if (GAME_KEYS.has(k) && !e.ctrlKey && !e.metaKey && !e.altKey) e.preventDefault();
  } else if (ARROWS.includes(k) || k === ' ') e.preventDefault();
});
addEventListener('keyup', e => { keys[kname(e)] = false; keys[e.key.toLowerCase()] = false; });
// ratón: mantener el clic izquierdo dispara hacia el cursor (libera las flechas si el teclado no registra tantas teclas a la vez)
const mouse = { x: 0, y: 0, down: false };
canvas.addEventListener('mousedown', e => { if (e.button === 0) { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; } });
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => { if (e.button === 2 && !inMenu && state && !state.over && !state.paused) useUlt(); });   // clic derecho = ulti
document.addEventListener('visibilitychange', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

// Cambio de arma: dir -1 = anterior (Q), 1 = siguiente (R)
function cycleWeapon(dir) {
  const ids = Object.keys(WEAPONS).filter(id => owns(id, stats.lv));
  if (ids.length < 2) return;
  const i = ids.indexOf(stats.weapon);
  stats.weapon = ids[(i + dir + ids.length) % ids.length];
  setWeapon(stats.weapon);
  sfx('click');
}

// La cámara sigue al jugador y se detiene en los bordes del mapa
function updateCamera() {
  cam.x = WW > VW ? clamp(player.x - VW / 2, 0, WW - VW) : (WW - VW) / 2;
  cam.y = WH > VH ? clamp(player.y - VH / 2, 0, WH - VH) : (WH - VH) / 2;
}
function inView(e, m) {
  return e.x > cam.x - m && e.x < cam.x + VW + m && e.y > cam.y - m && e.y < cam.y + VH + m;
}

// ============ DIFICULTAD ============
function pickType(t) {
  const w = {
    tri:    Math.max(3, 10 - t / 25),
    fast:   t < 20 ? 0 : Math.min(8, 1 + (t - 20) / 10),
    shoot:  t < 40 ? 0 : Math.min(4, 1 + (t - 40) / 30),
    bomb:   t < 30 ? 0 : Math.min(3, 1 + (t - 30) / 60),
    sq:     t < 60 ? 0 : Math.min(3.5, 0.5 + (t - 60) / 60),      // Tanques: raros
    dash:   t < 75 ? 0 : Math.min(3, 0.5 + (t - 75) / 40),
    heal:   t < 120 ? 0 : Math.min(2, 0.5 + (t - 120) / 90),
    split:  t < 90 ? 0 : Math.min(2.5, 0.5 + (t - 90) / 60),
    shield: t < 100 ? 0 : Math.min(3, 0.6 + (t - 100) / 80),
    dup:    t < 120 ? 0 : Math.min(4.5, 1.5 + (t - 120) / 50),    // Dúplice: común
    summon: t < 150 ? 0 : Math.min(2, 0.4 + (t - 150) / 100),
    boss:   t < 150 ? 0 : Math.min(1.5, 0.4 + (t - 150) / 200),   // Coloso: a partir de 2,5 min, raro
    sniper: t < 150 ? 0 : Math.min(2.5, 0.5 + (t - 150) / 90),
    ghost:  t < 200 ? 0 : Math.min(2.5, 0.5 + (t - 200) / 80),
    ghostB: t < 220 ? 0 : Math.min(2, 0.5 + (t - 220) / 60),
    ghostY: t < 240 ? 0 : Math.min(2, 0.5 + (t - 240) / 60),
    ghostR: t < 275 ? 0 : Math.min(1.5, 0.5 + (t - 275) / 60),
    ghostBlue:   t < 310 ? 0 : 1.5,
    ghostPurple: t < 360 ? 0 : 1,
    ghostGray:   t < 410 ? 0 : 1.2,
    ghostOrange: t < 460 ? 0 : 1.2,
    ghostGreen:  t < 520 ? 0 : 1
  };
  // ronda robot: [peso, segundo en que empieza a salir]
  const RS = { robBrown: [3, 600], robPink: [2, 600], robTank: [1, 600], robCeleste: [2, 600], robRed: [2, 610], robOrange: [2, 620], robYellow: [1.5, 640],
               robNavy: [1.5, 660], robLime: [1, 680], robBlack: [1, 700], robSword: [1, 720], robViolet: [1, 740], robGray: [1, 760],
               robWhite: [1, 780], robPurple: [0.5, 810], robGold: [0.4, 840] };
  for (const k in RS) w[k] = state.phase3 && t >= RS[k][1] ? RS[k][0] : 0;
  // ronda arcoíris: [peso, segundo en que empieza a salir]
  const RB = { rbCircle: [3, 900], rbTri: [2, 910], rbArrow: [1.5, 920], rbRhomb: [1.5, 930], rbOct: [1.5, 940], rbMoon: [1.5, 950], rbSq: [0.6, 960], rbDrop: [1.5, 960],
               rbPent: [1, 970], rbBolt: [1, 980], rbStar4: [1, 990], rbHex: [1, 1000], rbSpiral: [1, 1000], rbCross: [1, 1010], rbStar5: [1, 1020], rbStar8: [1.3, 1040] };
  for (const k in RB) w[k] = state.phase4 && t >= RB[k][1] ? RB[k][0] : 0;
  if (state.phase4) { for (const k in w) if (!CFG.enemies[k].rb) w[k] = 0; }
  else if (state.phase3) { for (const k in w) if (!CFG.enemies[k].robot) w[k] = 0; }          // ronda final: solo robots
  else if (state.phase2) for (const k in w) if (!CFG.enemies[k].phantom) w[k] = 0;      // tras el primer jefe solo salen fantasmas
  let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) { if ((r -= w[k]) < 0) return k; }
  return state.phase3 ? null : 'tri';   // ronda robot: si ya hay muchos, no sale nada
}

function makeEnemy(type, x, y) {
  const def = CFG.enemies[type];
  const mult = def.noScale ? 1 : 1 + CFG.hpGrowthPerMin * Math.floor(state.time / 60);
  const hp = def.hp * mult * state.diff.hp * (isBossT(type) ? state.mods.bhp : state.mods.hp) * (state.inf ? state.inf.m : 1);
  return {
    type, x, y, hp, maxHp: hp, angle: 0, entered: false,
    shootT: 1 + Math.random(),
    phase: 'chase', phaseT: 2 + Math.random() * 2, dashDir: { x: 1, y: 0 },   // Embestidor
    healT: 2 + Math.random(), sumT: 3 + Math.random() * 2,                       // Curandero / Invocador
    snipe: 'idle', snT: 2 + Math.random() * 2, lockA: 0,                         // Francotirador
    strafe: Math.random() < 0.5 ? 1 : -1,
    atkT: 2.5                                                                    // Titán
  };
}

// Segundos entre oleadas. Hasta el minuto 3 baja suavemente a 2,0 s;
// desde el minuto 3, durante 3 minutos, cada minuto baja 0,3 s más (1,7 → 1,4 → 1,1) y ahí se queda.
function spawnInterval(t) {
  if (t < 180) return Math.max(2.0, 2.8 - t * 0.0045);
  const steps = Math.min(3, Math.floor((t - 180) / 60) + 1);
  return 2.0 - 0.3 * steps;
}

// Cada enemigo aparece fuera de la vista, junto a una de sus esquinas, en un punto libre
// (separado de los demás) para que los de una misma oleada no salgan solapados.
function spawnEnemy() {
  const type = pickType(state.time);
  if (!type) return;
  const size = CFG.enemies[type].size;
  let x = cam.x, y = cam.y;
  for (let tries = 0; tries < 20; tries++) {
    const corner = Math.floor(Math.random() * 4);
    const sx = corner % 2 === 0 ? -1 : 1, sy = corner < 2 ? -1 : 1;
    x = (sx < 0 ? cam.x : cam.x + VW) + sx * (30 + Math.random() * 90);
    y = (sy < 0 ? cam.y : cam.y + VH) + sy * (30 + Math.random() * 90);
    if (state.phase3 && Math.random() < 0.5) {   // ronda robot: también aparecen por arriba, abajo, izquierda y derecha
      const side = Math.floor(Math.random() * 4), off = 30 + Math.random() * 90;
      if (side === 0) { x = cam.x + Math.random() * VW; y = cam.y - off; }
      else if (side === 1) { x = cam.x + Math.random() * VW; y = cam.y + VH + off; }
      else if (side === 2) { x = cam.x - off; y = cam.y + Math.random() * VH; }
      else { x = cam.x + VW + off; y = cam.y + Math.random() * VH; }
    }
    const free = enemies.every(e => Math.hypot(e.x - x, e.y - y) > (size + CFG.enemies[e.type].size) * 1.2);
    if (free) break;
  }
  if (type === 'robBrown') {   // manada de 10 robots pequeños, juntos pero sin solaparse
    const ix = x < cam.x + VW / 2 ? 1 : -1, iy = y < cam.y + VH / 2 ? 1 : -1;
    for (let i = 0; i < 10; i++)
      enemies.push(makeEnemy(type, clamp(x + ix * (i % 4) * 26, -150, WW + 150), clamp(y + iy * Math.floor(i / 4) * 26, -150, WH + 150)));
    return;
  }
  enemies.push(makeEnemy(type, clamp(x, -150, WW + 150), clamp(y, -150, WH + 150)));
}

// Jefes: el Titán a los 5:00 y el Rey Fantasma a los 10:00. Al aparecer mueren todos los enemigos.
function spawnBoss(type) {
  type = type || 'final';
  if (type === 'final') state.bossSpawned = true; else if (type === 'final2') state.boss2Spawned = true; else if (type === 'final3') state.boss3Spawned = true; else state.boss4Spawned = true;
  for (const e of enemies) {
    const def = CFG.enemies[e.type];
    state.kills++; state.killsBy[e.type] = (state.killsBy[e.type] || 0) + 1;
    burst(e.x, e.y, def.color, 14);
    dropCoins(e, def);
  }
  enemies = []; ebullets = []; bombs = []; fires = [];
  state.flash = 0.8;
  sfx('boom');
  const corners = [[cam.x, cam.y, -1, -1], [cam.x + VW, cam.y, 1, -1], [cam.x, cam.y + VH, -1, 1], [cam.x + VW, cam.y + VH, 1, 1]];
  corners.sort((a, b) => Math.hypot(b[0] - player.x, b[1] - player.y) - Math.hypot(a[0] - player.x, a[1] - player.y));
  const c = corners[0];
  enemies.push(makeEnemy(type, clamp(c[0] + c[2] * 90, -150, WW + 150), clamp(c[1] + c[3] * 90, -150, WH + 150)));
  state.banner = { text: type === 'final' ? '¡TODOS HAN MUERTO! EL TITÁN HA LLEGADO' : type === 'final2' ? '¡TODOS HAN MUERTO! EL REY FANTASMA HA LLEGADO' : type === 'final3' ? '¡TODOS HAN MUERTO! EL MECHA TITÁN HA LLEGADO' : '¡TODOS HAN MUERTO! EL POLÍGONO ARCOÍRIS HA LLEGADO', t: 4 };
  sfx('summon');
}

// ============ OBSTÁCULOS ============
function hitsObstacle(x, y, r) {
  for (const b of obstacles) {
    if (b.circle) { if (Math.hypot(x - b.cx, y - b.cy) < b.r + r) return true; continue; }
    if (x > b.x - r && x < b.x + b.w + r && y > b.y - r && y < b.y + b.h + r) return true;
  }
  return false;
}
// Saca a un círculo (o) de radio r fuera de los obstáculos. Devuelve true si lo ha movido.
function pushOutOfRects(o, r) {
  let moved = false;
  for (const b of obstacles) {
    if (b.circle) {
      const dx = o.x - b.cx, dy = o.y - b.cy, d = Math.hypot(dx, dy), md = b.r + r;
      if (d < md) {
        if (d > 0.0001) { o.x = b.cx + dx / d * md; o.y = b.cy + dy / d * md; } else o.x = b.cx + md;
        moved = true;
      }
      continue;
    }
    const cx = clamp(o.x, b.x, b.x + b.w), cy = clamp(o.y, b.y, b.y + b.h);
    const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
    if (d < r) {
      if (d > 0.0001) { o.x = cx + dx / d * r; o.y = cy + dy / d * r; }
      else {   // el centro está dentro del obstáculo: sale por el lado más cercano
        const l = o.x - b.x, rr = b.x + b.w - o.x, t = o.y - b.y, bb = b.y + b.h - o.y;
        const m = Math.min(l, rr, t, bb);
        if (m === l) o.x = b.x - r; else if (m === rr) o.x = b.x + b.w + r;
        else if (m === t) o.y = b.y - r; else o.y = b.y + b.h + r;
      }
      moved = true;
    }
  }
  return moved;
}

// ============ COMBATE ============
function aimVec() {
  const dx = (keys['arrowright'] || keys['l'] ? 1 : 0) - (keys['arrowleft'] || keys['j'] ? 1 : 0);
  const dy = (keys['arrowdown'] || keys['k'] ? 1 : 0) - (keys['arrowup'] || keys['i'] ? 1 : 0);
  if (!dx && !dy) {
    if (mouse.down && player && !inMenu) {   // disparo con el ratón hacia el cursor
      const mx = cam.x + mouse.x / Z - player.x, my = cam.y + mouse.y / Z - player.y, l = Math.hypot(mx, my);
      if (l > 4) return { x: mx / l, y: my / l };
    }
    return null;
  }
  const l = Math.hypot(dx, dy);
  return { x: dx / l, y: dy / l };
}

function discReturn(b) { if (b.ret) return; b.ret = true; b.hit = new Set(); if (b.edge) b.dmg *= 1.5; b.life = Math.max(b.life, 3); }
function addBullet(x, y, vx, vy, life, dmg, extra) {
  bullets.push(Object.assign({ x, y, vx, vy, life, dmg, r: CFG.bulletRadius, color: '#fff', kind: 'bullet', pierce: false }, extra || {}));
}

const ULT_CD = 60;
const ULTS = {

function shotgunUlt(a) {
  const ws = WEAPONS.shotgun.stats(stats.lv), dm = dmgMul(), base = Math.atan2(a.y, a.x);
  const n = ws.pellets * 2, step = 0.36 / Math.max(1, n - 1);
  for (let i = 0; i < n; i++) {
    const g = base + (i - (n - 1) / 2) * step + (Math.random() - 0.5) * 0.08, sp = 650 * (0.9 + Math.random() * 0.2);
    addBullet(player.x + a.x * 16, player.y + a.y * 16, Math.cos(g) * sp, Math.sin(g) * sp, 0.9, ws.dmg * dm, { explosive: true, boomR: 50, boomDmg: ws.dmg * 2 * dm, r: 6, color: '#fb923c' });
  }
  sfx('shotgun');
}
function useUlt() {
  if (!state || state.over || state.ult > 0) return;
  const id = stats.weapon, ws = WEAPONS[id].stats(stats.lv), dm = dmgMul();
  const a = lastAim || { x: 1, y: 0 }, base = Math.atan2(a.y, a.x);
  if (id === 'pistol') {
    state.ultShots = { rounds: 3, t: 0, n: 0, dmg: ws.dmg * 3 * dm };   // 3 rondas de 8 balas, 0,1 s entre rondas
    state.buffSpd = 2;
  } else if (id === 'shotgun') {
    shotgunUlt(a);
    if (ws.double2) state.ultEcho = { t: 0.05, a: { x: a.x, y: a.y } };   // con "Doble disparo" la ulti se repite (y con "doble doble" cada volea ya lleva el doble de proyectiles)
    state.buffDef = 5;
  } else if (id === 'rifle') {
    addBullet(player.x + a.x * 20, player.y + a.y * 20, a.x * 1500, a.y * 1500, 1.0, ws.dmg * 10 * dm, { kind: 'ult', pierce: true, hit: new Set(), r: 40, color: 'rgba(254,240,138,.85)' });
    for (const e of enemies) {   // onda que aparta un poco a los enemigos
      const dx = e.x - player.x, dy = e.y - player.y, d = Math.hypot(dx, dy);
      if (d < 260) { const k = 110 * (1 - d / 330) / (d || 1); e.x += dx * k; e.y += dy * k; }
    }
    fx.push({ kind: 'ring', x: player.x, y: player.y, r: 260, t: 0, dur: 0.5, color: '#fef08a' });
  } else if (id === 'mg') {
    state.buffMg = 4;
  } else if (id === 'flame') {
    explode(player.x, player.y, 240, (80 + ws.dmg * 10) * dm, { fire: true, fireDmg: 20 });   // el fuego del centro hace x4 de daño
    for (let i = 0; i < 10; i++) { const g = i * Math.PI * 2 / 10; fires.push({ x: player.x + Math.cos(g) * 170, y: player.y + Math.sin(g) * 170, r: 55, t: 4, tick: 0, dmg: 8 }); }
    player.hp = Math.min(stats.maxHp, player.hp + stats.maxHp * 0.2);
    fx.push({ kind: 'ring', x: player.x, y: player.y, r: 60, t: 0, dur: 0.5, color: '#4ade80' });
  } else if (id === 'launcher') {
    const w = ws, bd = (30 + 6 * w.ldmg) * dm;
    for (let i = -2; i <= 2; i++) {   // 5 cohetes al frente con triple daño
      const g = base + i * 0.12;
      addBullet(player.x + a.x * 16, player.y + a.y * 16, Math.cos(g) * 520, Math.sin(g) * 520, 1.0, 0, { kind: 'rocket', r: 7, color: '#fb923c', boomR: w.radius, boomDmg: bd * 6, fire: w.fire, fireT: w.fireT, fireDmg: w.fireDmg, double2: w.double });
    }
    explode(player.x, player.y, w.radius, bd * 2, { fire: w.fire, fireT: w.fireT, fireDmg: w.fireDmg });   // y explota a tu alrededor con daño normal
    state.buffRate = 2;
  } else if (id === 'arc') {
    for (const e of enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - player.x, e.y - player.y) > 800) continue;
      arcHit(e, ws.dmg * 6 * dm, 1);
      fx.push({ kind: 'laser', x: e.x + (Math.random() - 0.5) * 60, y: e.y - 420, x2: e.x, y2: e.y, t: 0, dur: 0.3, color: '#e0f2fe' });
    }
    state.buffRate = 2;
  } else if (id === 'sword') {
    { const rl = lv_(stats.lv, 'sword_rb'); if (rl === 1) state.rbT = 30; else if (rl === 2) state.rbT = 60; }
    const UR = 280, CL = 110;   // rango normal de la ulti y rango "muy cerca" del Caos
    for (const e of enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - player.x, e.y - player.y) > UR + CFG.enemies[e.type].size) continue;
      arcHit(e, ws.dmg * 5 * (ws.vacio && Math.hypot(e.x - player.x, e.y - player.y) - CFG.enemies[e.type].size < CL ? 4 : 1) * dm, 0);
    }
    for (const b of ebullets) if (!b.orb && Math.hypot(b.x - player.x, b.y - player.y) < UR) b.dead = true;
    fx.push({ kind: 'slash', x: player.x, y: player.y, a: -Math.PI / 2, range: UR, arc: Math.PI * 2, dir: 1, t: 0, dur: 0.5, color: ws.vacio ? '#c084fc' : '#fde047' });
    if (ws.vacio) { fx.push({ kind: 'ring', x: player.x, y: player.y, r: CL * 1.5, t: 0, dur: 0.7, color: '#7e22ce' }); fx.push({ kind: 'boom', x: player.x, y: player.y, r: CL, t: 0, dur: 0.6, color: '#3b0764' }); }
    state.buffSpd = 2;
  } else if (id === 'saw') {
    for (let i = 0; i < 10; i++) {
      const g = i * Math.PI * 2 / 10;
      addBullet(player.x, player.y, Math.cos(g) * 650, Math.sin(g) * 650, 4, ws.dmg * 2 * dm, { kind: 'disc', pierce: true, hit: new Set(), r: ws.r * 1.1, color: '#e5e7eb', tt: 0, out: ws.out + 0.1, edge: ws.edge });
    }
    state.buffSpd = 2;
  }
  if (state.practice) state.ult = 0;   // en las pruebas la ulti no tiene espera
  else { state.ultTotal = ULT_CD * (state.ultHalf ? 0.5 : 1); state.ultHalf = false; state.ult = state.ultTotal; }
  fx.push({ kind: 'ring', x: player.x, y: player.y, r: 200, t: 0, dur: 0.5, color: '#fde047' });
  state.banner = { text: '¡ULTI: ' + ULTS[id].name.toUpperCase() + '!', t: 1.5 };
  sfx('power'); sfx('boom');
}

function dmgMul() { return (state.pw.p_dmg.t > 0 ? 2 : 1) * (state.buffMg > 0 ? 1.08 : 1) * (1 + 0.04 * lv_(stats.lv, 'gdmg')) * (1 + (stats.weapon === 'saw' ? 0.048 : 0.08) * lv_(stats.lv, 'mast_' + stats.weapon)); }
function rateMul() { return (1 + 0.04 * lv_(stats.lv, 'grate')) * (1 + 0.06 * lv_(stats.lv, 'tempo_' + stats.weapon)); }   // poder Furia

// Bastón de rayos: el rayo busca a los enemigos más cercanos a tu puntería y salta entre los que tienen cerca
// Modos de la espada: Shift cambia entre ataque normal, a distancia y corte molecular (según lo comprado)
function swModes(ws) { const m = ['normal']; if (ws.ranged) m.push('ranged'); if (ws.mol) m.push('mol'); return m; }
function swMode(ws) { const m = swModes(ws); return m[(state.swMode || 0) % m.length]; }
const SW_NAMES = { normal: 'Corte normal', ranged: 'Corte a distancia', mol: 'Corte molecular' };
// Filo arcoíris: cada corte lleva un color con su efecto
const RB_COLS = ['#ee1c25', '#ff8426', '#fff200', '#b5e61d', '#99d9ea', '#3f48cc', '#7a0bc0'];
function rbActive() { return lv_(stats.lv, 'sword_rb') >= 3 || (state.rbT || 0) > 0; }
function rbEffect(e, ci, dmg) {   // 0 rojo, 1 naranja, 2 amarillo, 3 verde, 4 azul claro, 5 azul oscuro (más rango, en la geometría del corte), 6 morado = todos
  if (e.hp <= 0) return;
  const all = ci === 6;
  if (all || ci === 0) e.hp -= dmg;                                                                       // rojo: doble daño
  if (all || ci === 1) e.burn = { t: 3, dps: dmg * 0.3 };                                                 // naranja: quema (y el fuego daña a los vecinos)
  if (all || ci === 2) e.stun = Math.max(e.stun || 0, 0.5);                                               // amarillo: paraliza 0,5 s
  if (all || ci === 3) player.hp = Math.min(stats.maxHp, player.hp + dmg * 0.05);                         // verde: roba el 5% del daño
  if (all || ci === 4) e.slowT = Math.max(e.slowT || 0, 2);                                               // azul claro: ralentiza
}
function swordCut(base, dmg, range, arc, dir, lines, big) {
  lines = lines || 1;
  const rbOn = rbActive(), rbI = state.rbI = (state.rbI || 0) + 1;   // cada corte lleva el siguiente color
  const lc = q => (rbI + q) % 7, rg = q => rbOn && lc(q) >= 5 ? 1.5 : 1;   // azul oscuro y morado: más rango
  let maxR = 1; if (rbOn) for (let q = 0; q < lines; q++) maxR = Math.max(maxR, rg(q));
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const rx = e.x - player.x, ry = e.y - player.y, d = Math.hypot(rx, ry), sz = CFG.enemies[e.type].size;
    if (d > range * maxR + sz) continue;
    let da = Math.atan2(ry, rx) - base; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (d > sz + 20 && Math.abs(da) > arc / 2) continue;
    let hit = false;
    for (let q = 0; q < lines; q++) {   // una vez por línea de corte
      if (d > range * rg(q) + sz) continue;
      hit = true; arcHit(e, dmg, 0); if (rbOn) rbEffect(e, lc(q), dmg);
    }
    if (hit) burst(e.x, e.y, '#ffffff', 4);
  }
  for (const b of ebullets) {   // la espada corta los disparos enemigos cercanos en la dirección del ataque
    if (b.dead || b.orb) continue;
    const rx = b.x - player.x, ry = b.y - player.y, d = Math.hypot(rx, ry);
    if (d > range + b.r) continue;
    let da = Math.atan2(ry, rx) - base; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (d > 24 && Math.abs(da) > arc / 2) continue;
    if (lv_(stats.lv, 'sword_refl') && b.r <= 8 && b.dmg <= 70) {   // reflejos: los proyectiles pequeños vuelven contra los enemigos
      const sp = Math.max(450, Math.hypot(b.vx, b.vy)), o = d || 1;
      addBullet(b.x, b.y, rx / o * sp, ry / o * sp, 1.4, Math.max(20, b.dmg * 3), { r: 6, color: '#fde68a' });
    }
    b.dead = true; burst(b.x, b.y, '#ffffff', 3);
  }
  range *= maxR;
  fx.push({ kind: 'slash', x: player.x, y: player.y, a: base, range, arc, dir, t: 0, dur: big ? 0.45 : 0.3, color: rbOn ? RB_COLS[rbI % 7] : big ? '#c084fc' : '#e0f2fe', mini: !big, lines });
  sfx('sword');
}
function arcHit(e, dmg, stun) {
  if (Math.random() < stats.critP) { dmg *= stats.critM; burst(e.x, e.y, '#fde047', 3); }
  e.hp -= dmg; burst(e.x, e.y, '#7dd3fc', 3); sfx('hit');
  if (stun) e.stun = Math.max(e.stun || 0, stun);
}
function arcShoot(a, ws) {
  const dx = a.x, dy = a.y, ang = Math.atan2(dy, dx);
  const cands = [];
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const rx = e.x - player.x, ry = e.y - player.y, along = rx * dx + ry * dy, perp = Math.abs(rx * dy - ry * dx);
    if (along > 0 && along < 720 && perp < 140 + along * 0.25) cands.push({ e, score: perp + along * 0.15 });
  }
  cands.sort((p, q) => p.score - q.score);
  const used = new Set(); let fired = 0;
  for (const c of cands) {
    if (fired >= ws.beams) break;
    if (used.has(c.e)) continue;
    fired++;
    let cur = c.e, from = { x: player.x + dx * 14, y: player.y + dy * 14 };
    for (let j = 0; j <= ws.chains && cur; j++) {
      used.add(cur);
      fx.push({ kind: 'laser', x: from.x, y: from.y, x2: cur.x, y2: cur.y, t: 0, dur: 0.14, color: '#7dd3fc' });
      if (shieldBlocks(cur, from.x, from.y)) { burst(cur.x, cur.y, '#e0f2fe', 3); sfx('block'); break; }
      arcHit(cur, ws.dmg, ws.stun);
      from = cur;
      let best = null, bd = ws.jump;
      for (const o of enemies) if (o.hp > 0 && !used.has(o)) { const d = Math.hypot(o.x - from.x, o.y - from.y); if (d < bd) { bd = d; best = o; } }
      cur = best;
    }
  }
  if (!fired) fx.push({ kind: 'laser', x: player.x + dx * 14, y: player.y + dy * 14, x2: player.x + dx * 260, y2: player.y + dy * 260, t: 0, dur: 0.1, color: '#7dd3fc' });
}

function shoot(a, echo) {
  const R = CFG.playerRadius;
  const id = stats.weapon, w = WEAPONS[id], ws = w.stats(stats.lv);
  const dm = dmgMul();
  ws.dmg *= dm;
  const sx = player.x + a.x * R, sy = player.y + a.y * R;
  const base = Math.atan2(a.y, a.x);
  if (id === 'shotgun') {
    const n = ws.pellets;
    for (let i = 0; i < n; i++) {
      const ang = base + (i - (n - 1) / 2) * (0.36 / Math.max(1, n - 1)) + (Math.random() - 0.5) * 0.08;   // pequeña desviación
      const sp = 650 * (0.9 + Math.random() * 0.2);
      addBullet(sx, sy, Math.cos(ang) * sp, Math.sin(ang) * sp, 0.8, ws.dmg, ws.pierce ? { pierceN: 1, hit: new Set() } : null);
    }
  } else if (id === 'rifle') {
    const shared = new Set();   // sin "Daño por bala", las balas comparten la lista de enemigos ya golpeados
    for (const off of (ws.five ? [-0.32, -0.16, 0, 0.16, 0.32] : ws.triple ? [-0.16, 0, 0.16] : [0])) {
      const ang = base + off;
      addBullet(sx, sy, Math.cos(ang) * 1100, Math.sin(ang) * 1100, 1.2, ws.dmg, { pierce: true, hit: ws.indep ? new Set() : shared, r: ws.big ? 9 : 5, color: '#fde68a' });
    }
  } else if (id === 'mg') {
    const ang = base + (Math.random() * 2 - 1) * 0.07;                              // desvío de bala
    const explosive = state.buffMg > 0 || (ws.explo && Math.random() < ws.explP);
    addBullet(sx, sy, Math.cos(ang) * 750, Math.sin(ang) * 750, 1.1, ws.dmg,
      explosive ? { explosive: true, boomR: 60 + 5 * ws.boomLv, boomDmg: ws.dmg * 4 * (1 + 0.15 * ws.boomLv), r: 6, color: '#fb923c' } : {});
  } else if (id === 'flame') {
    const ang = base + (Math.random() * 2 - 1) * ws.spread;
    const sp = 420 * (0.85 + Math.random() * 0.3);
    addBullet(sx, sy, Math.cos(ang) * sp, Math.sin(ang) * sp, ws.life, ws.dmg,
      { kind: 'flame', pierce: true, hit: new Set(), r: ws.r, grow: 25, maxLife: ws.life });
  } else if (id === 'launcher') {
    addBullet(sx, sy, a.x * 520, a.y * 520, 1.0, 0,
      { kind: 'rocket', r: 7, color: '#fb923c', boomR: ws.radius, boomDmg: (30 + 6 * ws.ldmg) * (1 + 0.1 * lv_(stats.lv, 'l_dmgx')) * dm, fire: ws.fire, fireT: ws.fireT, fireDmg: ws.fireDmg, double2: ws.double, split: ws.split });
  } else if (id === 'arc') {
    arcShoot(a, ws);
  } else if (id === 'sword') {
    const mode = swMode(ws);
    if (mode === 'ranged') {   // corte a distancia: ondas que salen despedidas hacia delante
      for (let i = 0; i < ws.cuts; i++) {
        const off = (i - (ws.cuts - 1) / 2) * 30;   // ondas paralelas
        addBullet(sx - Math.sin(base) * off, sy + Math.cos(base) * off, Math.cos(base) * 600, Math.sin(base) * 600, 0.8, ws.dmg * 0.75, { kind: 'wave', pierce: true, hit: new Set(), r: 40, ang: base, color: rbActive() ? RB_COLS[(i + (state.rbI = (state.rbI || 0) + 1)) % 7] : '#e0f2fe', rb: rbActive() ? ((state.rbI + i) % 7) : undefined });
        { const wb = bullets[bullets.length - 1]; if (wb.rb >= 5) wb.life *= 1.6; }   // azul oscuro / morado: la onda llega más lejos
      }
      fx.push({ kind: 'slash', x: player.x, y: player.y, a: base, range: 70, arc: 1.8, dir: 1, t: 0, dur: 0.25, color: '#bae6fd' });
      sfx('sword');
    } else if (mode === 'mol') {   // corte molecular: enorme, doble de daño, muy lento
      swordCut(base, ws.dmg * 2, ws.range * 1.9, 3.0, 1, ws.cuts, true);
    } else {
      swordCut(base, ws.dmg, ws.range, ws.arc, 1, ws.cuts);   // doble / triple corte: líneas paralelas a la vez
    }
  } else if (id === 'saw') {
    const n = ws.count;
    for (let i = 0; i < n; i++) {
      const g = base + (i - (n - 1) / 2) * 0.28;
      addBullet(sx, sy, Math.cos(g) * 650, Math.sin(g) * 650, 4, ws.dmg, { kind: 'disc', pierce: true, hit: new Set(), r: ws.r, color: '#e5e7eb', tt: 0, out: ws.out, edge: ws.edge });
    }
  } else {
    const ux = Math.cos(base), uy = Math.sin(base);
    for (const o of (ws.double && ws.triple ? [-10, 0, 10] : ws.double ? [-6, 6] : [0]))
      addBullet(sx - uy * o, sy + ux * o, ux * 650, uy * 650, 1.6, ws.dmg, ws.pierce ? { pierceN: 3, hit: new Set() } : null);
  }
  sfx(id);
  if (echo) return;
  player.cdMax = (ws.cooldown !== undefined ? ws.cooldown : w.cooldown) / rateMul();
  if (id === 'sword') { const md = swMode(ws); if (md === 'ranged') player.cdMax *= 1.6; else if (md === 'mol') player.cdMax *= 3.2; }   // ataques más lentos
  player.cd = player.cdMax;
  if (id === 'shotgun' && ws.double2) state.echo = { t: 0.05, a: { x: a.x, y: a.y } };
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.3, color });
  }
}

// Monedas que suelta un enemigo: 'value' = valor total (diamantes de 10 + monedas sueltas de 1);
// con bigCoin es una sola moneda especial de ese valor (ej. 100)
function dropCoins(e, def) {
  if (e.noDrop) return;
  let v = def.value || 0;
  const fl = Math.floor(v); v = fl + (Math.random() < v - fl ? 1 : 0);   // los decimales son probabilidad
  if (v <= 0) return;
  const jit = () => (Math.random() - .5) * 36;
  const big = v > 100 ? Math.floor(v / 100) : 0;       // más de 100 monedas -> monedas verdes de 100
  v -= big * 100;
  for (let i = 0; i < big; i++) coins.push({ x: e.x + (big > 1 ? jit() : 0), y: e.y + (big > 1 ? jit() : 0), value: 100, special: true });
  const gems = Math.floor(v / 10), rest = v % 10;
  for (let i = 0; i < gems; i++) coins.push({ x: e.x + jit(), y: e.y + jit(), value: 10, special: true });
  for (let i = 0; i < rest; i++) coins.push({ x: e.x + jit() * 0.6, y: e.y + jit() * 0.6, value: 1 });
}

function hurtPlayer(dmg) {
  if (player.invuln > 0 || state.over) return;
  dmg *= curBossSrc ? state.mods.bdmg : state.mods.dmg;   // modificadores de daño de los enemigos / jefes
  let m = 1 - stats.armor;                       // Armadura pasiva
  if (state.pw.p_def.t > 0) m *= 0.5;            // poder Coraza
  if (state.buffDef > 0) m *= 0.8;               // ulti de la escopeta: 20% de resistencia
  player.hp -= dmg * m;
  player.invuln = CFG.invulnTime + stats.invuln;
  burst(player.x, player.y, '#ff5d6c', 10);
  sfx('hurt');
  if (player.hp <= 0) {
    if (state.practice) { player.hp = stats.maxHp; player.invuln = 1.5; }   // en el modo prueba no se muere
    else { player.hp = 0; gameOver(); }
  }
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// El escudo del Escudero bloquea todo lo que viene de su frente (±75°)
function shieldBlocks(e, sx, sy) {
  if (e.type !== 'shield' && e.type !== 'robCeleste') return false;
  let d = Math.atan2(sy - e.y, sx - e.x) - e.angle;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  return Math.abs(d) < 1.3;
}

// Explosión en área que daña a los enemigos (el escudo frontal también la bloquea)
function explode(x, y, r, dmg, opts) {
  opts = opts || {};
  fx.push({ kind: 'boom', x, y, r, t: 0, dur: 0.35, color: opts.color || '#fb923c' });
  sfx('boom');
  burst(x, y, '#fb923c', 10);
  for (const e of enemies) {
    const size = CFG.enemies[e.type].size;
    if (Math.hypot(e.x - x, e.y - y) - size < r) {
      if (!opts.pierce && shieldBlocks(e, x, y)) { burst(e.x, e.y, '#e0f2fe', 3); continue; }
      e.hp -= dmg;
      burst(e.x, e.y, CFG.enemies[e.type].color, 3);
    }
  }
  if (opts.fire) fires.push({ x, y, r: r * 0.64, t: 2 + (opts.fireT || 0), tick: 0, dmg: opts.fireDmg || 5 });   // área de fuego -20%
}
function detonate(b) {
  if (b.kind !== 'rocket' || b.det) return;
  b.det = true;
  explode(b.x, b.y, b.boomR, b.boomDmg, { fire: b.fire, fireT: b.fireT, fireDmg: b.fireDmg });
  if (b.double2) (state.boom2 = state.boom2 || []).push({ t: 0.35, x: b.x, y: b.y, r: b.boomR, dmg: b.boomDmg });   // 2ª explosión
}

// Fantasma rojo: al morir explota; la explosión solo daña al jugador
function explodeGhost(e, def) {
  fx.push({ kind: 'boom', x: e.x, y: e.y, r: def.boom.r, t: 0, dur: 0.4, color: '#ef4444' });
  sfx('boom');
  burst(e.x, e.y, '#ef4444', 16);
  if (Math.hypot(player.x - e.x, player.y - e.y) < def.boom.r + CFG.playerRadius) hurtPlayer(def.boom.dmg * state.diff.dmg);
}

function explodeBomb(b) {
  b.dead = true;
  fx.push({ kind: 'boom', x: b.x, y: b.y, r: b.blast, t: 0, dur: 0.35, color: '#ef4444' });
  sfx('boom');
  burst(b.x, b.y, '#ef4444', 14);
  if (Math.hypot(player.x - b.x, player.y - b.y) < b.blast + CFG.playerRadius) hurtPlayer((b.dmg || 30) * (b.mortar ? RD : 1) * state.diff.dmg);
}

// Jefes: 3 escudos que giran a su alrededor y paran las balas del jugador (cada uno aguanta un poco de daño y luego se rompe)
function orbPos(e, o) { const R = CFG.enemies[e.type].size * 1.9; return { x: e.x + Math.cos(o.a) * R, y: e.y + Math.sin(o.a) * R }; }
function bossShield(e, dt) {
  if (!e.orbs) { const h = e.maxHp * 0.06; e.orbs = [0, 1, 2].map(i => ({ a: i * Math.PI * 2 / 3, hp: h, max: h })); }
  for (const o of e.orbs) o.a += dt * 1.6;
  e.orbs = e.orbs.filter(o => {
    if (o.hp > 0) return true;
    const p = orbPos(e, o); fx.push({ kind: 'ring', x: p.x, y: p.y, r: 50, t: 0, dur: 0.4, color: '#38bdf8' }); burst(p.x, p.y, '#38bdf8', 10); sfx('block'); return false;
  });
}

// ---- Poderes activos ----
function usePower(p) {
  if (!stats.lv[p.id]) return;                    // no comprado
  const s = state.pw[p.id];
  if (s.cd > 0) return;                           // en espera
  // la espera empieza a contar cuando termina el efecto: total = duración + espera
  s.cd = p.dur + Math.max(p.cd * 0.25, p.cd - stats.cdr);
  s.total = s.cd;
  s.t = p.dur;
  sfx('power');
  if (p.id === 'p_pulse') {
    const R = 220;
    fx.push({ kind: 'ring', x: player.x, y: player.y, r: R, t: 0, dur: 0.5, color: '#fde047' });
    sfx('boom');
    for (const e of enemies) {
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < R + CFG.enemies[e.type].size) {
        e.hp -= 40;
        const nx = d > 0.001 ? (e.x - player.x) / d : 1, ny = d > 0.001 ? (e.y - player.y) / d : 0;
        e.x += nx * 210; e.y += ny * 210;
        burst(e.x, e.y, '#fde047', 4);
      }
    }
    for (const b of ebullets) if (Math.hypot(b.x - player.x, b.y - player.y) < R) b.dead = true;
  } else if (p.id === 'p_dash') {
    explode(player.x, player.y, 450, 350, { color: '#fde047', pierce: true });
    fx.push({ kind: 'ring', x: player.x, y: player.y, r: 450, t: 0, dur: 0.5, color: '#fde047' });
  } else if (p.id === 'p_ult') {
    if (state.ult > 0) state.ult *= 0.5; else state.ultHalf = true;
    fx.push({ kind: 'ring', x: player.x, y: player.y, r: 80, t: 0, dur: 0.5, color: '#fde047' });
  } else if (p.id === 'p_heal') {
    player.hp = Math.min(stats.maxHp, player.hp + stats.maxHp * 0.4);

function keepDistance(e, def, minD, maxD, dt) {
  const dx = player.x - e.x, dy = player.y - e.y, d = Math.hypot(dx, dy) || 1;

  if (d > maxD) { mx = dx / d; my = dy / d; }
  else if (d < minD) { mx = -dx / d; my = -dy / d; }
  else { mx = -dy / d * e.strafe * 0.35; my = dx / d * e.strafe * 0.35; }   // rodea al jugador despacio
  e.x += mx * def.speed * dt; e.y += my * def.speed * dt;
  // una vez dentro del mundo, no salen de él
  if (!e.entered && e.x > 20 && e.x < WW - 20 && e.y > 20 && e.y < WH - 20) e.entered = true;
  if (e.entered) { e.x = clamp(e.x, 20, WW - 20); e.y = clamp(e.y, 20, WH - 20); }
}

function update(dt) {

    while (state.inf.steps < Math.floor(state.inf.t / 30)) {
      state.inf.steps++;
      const el = state.inf.steps * 30, step = el <= 300 ? 0.05 : el <= 600 ? 0.10 : el <= 900 ? 0.20 : el <= 1200 ? 0.50 : 1.0;
      const nm = state.inf.m + step, ratio = nm / state.inf.m; state.inf.m = nm;
      for (const e of enemies) { e.hp *= ratio; e.maxHp *= ratio; }

    }

        if (e.snT <= 0) { for (const s of [-1, 1]) fireRobLaser(e, e.lockA + s * 0.22, 30, 1800); e.snipe = 'idle'; e.snT = 2.5; }
      } else {
        keepDistance(e, def, 260, 400, dt);
        e.angle = toP; e.snT -= dt;
        if (e.snT <= 0 && inView(e, 0)) { e.snipe = 'charge'; e.snT = 0.5; e.lockA = toP; sfx('snipeCharge'); }
      }
    } else if (e.type === 'robAngel') {

      e.angle = toP;
      e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.02 * dt);
      e.shootT -= dt;
      if (e.shootT <= 0 && inView(e, 0)) {
        const fire = a => ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, dmg: 25 * RD * state.diff.dmg, r: 5, color: '#f8fafc' });
        if (e.hp > e.maxHp / 2) { for (let i = 0; i < 4; i++) fire(toP + (i - 1.5) * 0.12); e.shootT = 2; }

      }
    } else if (e.type === 'robBlack') {

      e.shootT -= dt;
      if (e.shootT <= 0 && inView(e, 0)) {
        for (let i = -1; i <= 1; i++) { const a = toP + i * 0.2; ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340, dmg: 30 * RD * state.diff.dmg, r: 5, color: '#a1a1aa' }); }
        sfx('enemyShot'); e.shootT = 1.8;
      }
    } else if (e.type === 'robGray') {
      // cohetes teledirigidos cada 3 s

      e.angle = toP;
      e.shootT -= dt;
      if (e.shootT <= 0 && inView(e, 0)) {
        ebullets.push({ x: e.x, y: e.y, vx: Math.cos(toP) * 230, vy: Math.sin(toP) * 230, dmg: 50 * RD * state.diff.dmg, r: 8, color: '#d4d4d8', missile: true, boomR: 70, homing: true, ttl: 5 });

    } else if (e.type === 'dash') {
      e.phaseT -= dt;

        if (e.phaseT <= 0) { e.phase = 'wind'; e.phaseT = 0.6; e.dashDir = { x: Math.cos(toP), y: Math.sin(toP) }; sfx('dashWarn'); }
      } else if (e.phase === 'wind') {
        e.angle = Math.atan2(e.dashDir.y, e.dashDir.x);
        if (e.phaseT <= 0) { e.phase = 'dash'; e.phaseT = 0.45; }
      } else {
        e.x += e.dashDir.x * 420 * dt; e.y += e.dashDir.y * 420 * dt;
        if (e.phaseT <= 0) { e.phase = 'chase'; e.phaseT = 2.5 + Math.random() * 1.5; }
      }

      // persecución directa (Básico, Relámpago, Tanque, Divisor, Coloso, Esquirla, Bomba, Escudero, Fantasma, Dúplice)

      e.y += Math.sin(toP) * def.speed * dt;

    if (e._k !== undefined && e._k !== 1 && e._px !== undefined) {

    }
    if (e.slowT > 0) {   // azul claro: movimiento a la mitad
      e.slowT -= edt;
      if (e._px !== undefined) { const mx = e.x - e._px, my = e.y - e._py; if (Math.hypot(mx, my) < 120) { e.x = e._px + mx * 0.5; e.y = e._py + my * 0.5; } }
    }
    if (e._k !== undefined) {
      const boss = isBossT(e.type), mo = state.mods, rf = boss ? mo.brate : mo.rate;
      const gf = boss ? mo.bgen : mo.gen;
      if (gf > rf) { const ex = edt * (gf - rf); for (const k of ['sumT', 'waveT']) if (typeof e[k] === 'number') e[k] -= ex; if (e.k && typeof e.k.s === 'number') e.k.s -= ex; }
      const df = Math.max(gf, mo.dup);
      if (df > rf && typeof e.cpT === 'number') e.cpT -= edt * (df - rf);
    }
  }
  for (const e of enemies) {   // parálisis del bastón y sangrado de la sierra
    if (e.stun > 0 && e._px !== undefined) { e.stun -= edt; e.x = e._px; e.y = e._py; }
    if (e.burn) {   // fuego del filo naranja: también daña a los enemigos que estén junto al quemado

  enemies = enemies.concat(spawned);

  // los enemigos no pueden alejarse mucho de la pantalla: si se pasan, se les arrastra hacia el jugador
  for (const e of enemies) {

  }
  for (const b of bullets) if (b.life <= 0) detonate(b);     // los cohetes explotan al final de su alcance
  bullets = bullets.filter(b => b.life > 0 && b.x > -80 && b.x < WW + 80 && b.y > -80 && b.y < WH + 80);

  // los enemigos no se solapan entre sí (2 pasadas para resolver grupos)
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
      const A = enemies[i], B = enemies[j];

        else { nx = (A.x - B.x) / d; ny = (A.y - B.y) / d; }

      }
    }
  }

  // los enemigos no atraviesan los obstáculos (salvo el Fantasma)
  if (obstacles.length) {
    for (const e of enemies) {
      if (CFG.enemies[e.type].phantom) continue;
      if (pushOutOfRects(e, CFG.enemies[e.type].size * 0.9) && e.type === 'dash' && e.phase === 'dash') {
        e.phase = 'chase'; e.phaseT = 2;   // la embestida se corta al chocar con un muro
      }
    }
  }

  // los enemigos no pueden superponerse al jugador; si lo tocan, le hacen daño
  for (const e of enemies) {
    const def = CFG.enemies[e.type];
    const minD = CFG.playerRadius + def.size * 0.8;
    let d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minD) {
      let nx, ny;
      if (d < 0.001) { const a = Math.random() * Math.PI * 2; nx = Math.cos(a); ny = Math.sin(a); }
      else { nx = (e.x - player.x) / d; ny = (e.y - player.y) / d; }

      fx.push({ kind: 'boom', x: e.x, y: e.y, r: 90, t: 0, dur: 0.4, color: '#e879f9' }); sfx('boom'); burst(e.x, e.y, '#e879f9', 14);
      hurtPlayer(300 * state.diff.dmg); e.slowT = 3; e.boomCd = 6;
    }

    curBossSrc = isBossT(e.type);

    if (e.type === 'ghostPurple') {   // suelta 1 fantasma azul y 2 amarillos
      for (const k of ['ghostBlue', 'ghostY', 'ghostY']) born.push(makeEnemy(k, e.x + (Math.random() - .5) * 50, e.y + (Math.random() - .5) * 50));

      for (const o of enemies) if (o !== e && o.hp > 0 && Math.hypot(o.x - e.x, o.y - e.y) < 260) { o.haste = 1; burst(o.x, o.y, '#fde047', 3); }

      for (const o of enemies) if (o !== e && o.hp > 0 && healable(o) && Math.hypot(o.x - e.x, o.y - e.y) < 320) { o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.5); burst(o.x, o.y, '#4ade80', 4); }

      state.banner = { text: '¡REY FANTASMA DERROTADO! LLEGAN LOS ROBOTS: SOBREVIVE HASTA LOS 15:00', t: 5 };

  }
  enemies = enemies.filter(e => e.hp > 0 && !(titanDied && e.type === 'mini') && !(kingDied && e.summoner && e.summoner.type === 'final2') && !(mechaDied && e.summoner && e.summoner.type === 'final3') && !(polyDied && e.summoner && e.summoner.type === 'final4')).concat(born);

    }
  }
