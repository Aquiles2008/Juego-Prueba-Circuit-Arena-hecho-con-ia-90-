  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.dur);
}

function gameOver() {
  state.over = true;
  sfx('gameover');
  document.getElementById('overTitle').textContent = 'Has caído';
  document.getElementById('overTitle').style.color = '';
  document.getElementById('badge').style.display = 'none';
  document.getElementById('badgeLabel').textContent = '';
  document.getElementById('infinite').style.display = 'none';
  const news = state.inf ? finishInf() : finishRun();
  document.getElementById('stats').textContent =
    `Tiempo: ${fmt(state.time)}  ·  Enemigos: ${state.kills}  ·  Monedas de la partida: ${state.coins}` + (state.inf ? `  ·  Modo infinito: ${fmt(state.inf.t)} (vida enemiga x${state.inf.m.toFixed(2)})` : '');
  document.getElementById('records').textContent = news.length ? `★ ¡Nuevo récord de ${news.join(', ')}!` : '';
  document.getElementById('over').style.display = 'flex';
}
// Fin de una partida que siguió en modo infinito: suma lo conseguido después de la victoria
function finishInf() {
  if (!state.inf || state.infDone) return [];
  state.infDone = true;
  const b = state.infBase, news = [], r = getRecords();
  setTotal(getTotal() + state.coins - b.coins);
  if (r.maxKills > 0 && state.kills > r.maxKills) news.push('enemigos');
  if (r.maxCoins > 0 && state.coins > r.maxCoins) news.push('monedas');
  if (!state.startStage) r.bestTime = Math.max(r.bestTime, state.time);
  r.maxKills = Math.max(r.maxKills, state.kills); r.maxCoins = Math.max(r.maxCoins, state.coins);
  r.totalKills += state.kills - b.kills; r.totalTime += state.time - b.time; r.totalCoins += state.coins - b.coins;
  setRecords(r);
  return news;
}

// Victoria: el Titán ha caído. Acaba la partida y se guarda una insignia para el mapa
function winGame() {
  state.over = true; state.won = true;
  sfx('win');
  const news = finishRun();
  saveBadge(currentMap, state.startStage ? null : state.time);
  saveProg(currentMap, 5);
  const t = document.getElementById('overTitle');
  t.textContent = '¡Victoria!'; t.style.color = '#ffd23f';
  document.getElementById('badge').style.display = 'flex';
  document.getElementById('badgeLabel').textContent = `Insignia: ${state.winBoss || 'Titán'} derrotado · ${MAPS[currentMap].name} (${state.diff.name})`;
  document.getElementById('stats').textContent =
    `Tiempo: ${fmt(state.time)}  ·  Enemigos: ${state.kills}  ·  Monedas de la partida: ${state.coins}`;
  document.getElementById('records').textContent = news.length ? `★ ¡Nuevo récord de ${news.join(', ')}!` : '';
  document.getElementById('over').style.display = 'flex';
  document.getElementById('infinite').style.display = state.practice ? 'none' : '';
}

function fmt(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ============ DIBUJO ============
function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, frac), h);
}

function polygon(n, R) {
  for (let i = 0; i < n; i++) {
    const a = i * Math.PI * 2 / n;
    if (i === 0) ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R); else ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
  }
  ctx.closePath();
}

function star(n, R, r) {
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n - Math.PI / 2, rad = i % 2 === 0 ? R : r;
    if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath();
}

const nowS = () => performance.now() / 1000;
const def_ = e => CFG.enemies[e.type];

function drawEnemy(e) {
  const def = CFG.enemies[e.type];
  const s = def.size;
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
  ctx.fillStyle = def.color; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  if (def.rb) ctx.fillStyle = 'hsl(' + Math.floor((nowS() * 120 + (e.x + e.y) * 0.3) % 360) + ',85%,58%)';   // arcoíris
  if (e.gT !== undefined && e.gT < 1.5 && Math.floor(nowS() * 10) % 2 === 0) ctx.fillStyle = '#fff';   // a punto de volver a crecer
  if (e.type === 'dash' && e.phase === 'wind' && Math.floor(e.phaseT * 14) % 2 === 0) ctx.fillStyle = '#fff';
  if (e.flash > 0) ctx.fillStyle = '#fff';   // destello al recibir daño
  if (def.phantom) ctx.globalAlpha = (e.type === 'final2' ? 0.9 : e.type === 'ghostB' ? 0.8 : 0.55) + 0.1 * Math.sin(nowS() * 4);
  ctx.beginPath();
  if (e.type === 'sq') {
    ctx.rect(-s, -s, s * 2, s * 2);
  } else if (e.type === 'shoot') {
    polygon(3, s * 1.2);                                      // triángulo equilátero
  } else if (e.type === 'split' || e.type === 'boss') {
    polygon(5, s * 1.1);                                      // pentágono
  } else if (e.type === 'dash') {
    ctx.moveTo(s * 1.3, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 1.3, 0); ctx.lineTo(0, -s); ctx.closePath();
  } else if (e.type === 'bomb') {
    ctx.arc(0, 0, s, 0, Math.PI * 2);
  } else if (e.type === 'heal') {
    ctx.rect(-s * 1.1, -s * 0.38, s * 2.2, s * 0.76); ctx.rect(-s * 0.38, -s * 1.1, s * 0.76, s * 2.2);   // cruz
  } else if (e.type === 'shield') {
    polygon(6, s * 1.1);
  } else if (e.type === 'summon') {
    star(5, s * 1.35, s * 0.6);
  } else if (e.type === 'final') {
    polygon(8, s * 1.1);
  } else if (def.shape) {
    const sh = def.shape.split(':'), n = +sh[1];
    if (sh[0] === 'circle') ctx.arc(0, 0, s, 0, Math.PI * 2);
    else if (sh[0] === 'square') ctx.rect(-s, -s, s * 2, s * 2);
    else if (sh[0] === 'rhomb') { ctx.moveTo(s * 1.3, 0); ctx.lineTo(0, s * 0.9); ctx.lineTo(-s * 1.3, 0); ctx.lineTo(0, -s * 0.9); ctx.closePath(); }
    else if (sh[0] === 'arrow') { ctx.moveTo(s * 1.8, 0); ctx.lineTo(s * 0.2, s * 1.1); ctx.lineTo(s * 0.2, s * 0.4); ctx.lineTo(-s * 1.4, s * 0.4); ctx.lineTo(-s * 1.4, -s * 0.4); ctx.lineTo(s * 0.2, -s * 0.4); ctx.lineTo(s * 0.2, -s * 1.1); ctx.closePath(); }
    else if (sh[0] === 'moon') { ctx.arc(0, 0, s * 1.1, -Math.PI * 0.5, Math.PI * 0.5, false); ctx.arc(s * 0.5, 0, s * 0.85, Math.PI * 0.5, -Math.PI * 0.5, true); ctx.closePath(); }
    else if (sh[0] === 'bolt') { ctx.moveTo(s * 0.4, -s * 1.5); ctx.lineTo(-s * 0.9, s * 0.2); ctx.lineTo(-s * 0.05, s * 0.2); ctx.lineTo(-s * 0.4, s * 1.5); ctx.lineTo(s * 0.9, -s * 0.25); ctx.lineTo(s * 0.05, -s * 0.25); ctx.closePath(); }
    else if (sh[0] === 'drop') { ctx.moveTo(s * 1.6, 0); ctx.quadraticCurveTo(s * 0.4, s * 0.9, -s * 0.3, s * 0.9); ctx.arc(-s * 0.3, 0, s * 0.9, Math.PI / 2, -Math.PI / 2); ctx.quadraticCurveTo(s * 0.4, -s * 0.9, s * 1.6, 0); ctx.closePath(); }
    else if (sh[0] === 'spiral') { ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.moveTo(s * 0.7, 0); for (let a = 0; a < 9; a += 0.4) { const r = s * 0.7 * (1 - a / 10); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } }
    else if (sh[0] === 'rect') ctx.rect(-s, -s * 0.8, s * 2, s * 1.6);
    else if (sh[0] === 'poly') polygon(n, s * 1.15);
    else if (sh[0] === 'star') star(n, s * 1.3, s * 0.6);
    else if (sh[0] === 'cross') { ctx.rect(-s * 1.1, -s * 0.38, s * 2.2, s * 0.76); ctx.rect(-s * 0.38, -s * 1.1, s * 0.76, s * 2.2); }
    else if (sh[0] === 'plane') { ctx.moveTo(s * 1.6, 0); ctx.lineTo(-s * 0.8, s * 1.2); ctx.lineTo(-s * 0.3, 0); ctx.lineTo(-s * 0.8, -s * 1.2); ctx.closePath(); }
  } else if (e.type === 'robBrown') {
    ctx.rect(-s, -s * 0.8, s * 2, s * 1.6);
  } else if (e.type === 'robPink') {
    polygon(6, s * 1.15);
  } else if (e.type === 'final4') {
    const n = [3, 4, 6, 0][(e.ph || 1) - 1];
    if (n) polygon(n, s * 1.15); else ctx.arc(0, 0, s, 0, Math.PI * 2);
  } else if (e.type === 'final3') {
    polygon(6, s * 1.15);
  } else if (e.type === 'robTank') {
    ctx.rect(-s * 1.2, -s, s * 2.4, s * 2);
  } else if (def.phantom) {
    ctx.arc(0, 0, s, 0, Math.PI * 2);
  } else if (e.type === 'sniper') {
    ctx.moveTo(s * 1.9, 0); ctx.lineTo(-s, s * 0.6); ctx.lineTo(-s, -s * 0.6); ctx.closePath();
  } else {
    ctx.moveTo(s * 1.2, 0); ctx.lineTo(-s, s * 0.9); ctx.lineTo(-s, -s * 0.9); ctx.closePath();   // triángulos (Básico, Relámpago, Esquirla, Dúplice)
  }
  ctx.fill(); ctx.stroke();
  if (e.type === 'robPink' && e.fuse !== undefined && Math.floor(e.fuse * 14) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); polygon(6, s * 0.8); ctx.fill(); }
  if (def.robot) { ctx.fillStyle = e.turretOn ? '#ef4444' : '#e2e8f0'; ctx.beginPath(); ctx.arc(s * 0.35, 0, Math.max(2.5, s * 0.22), 0, Math.PI * 2); ctx.fill(); }
  if (e.type === 'robTank') { ctx.fillStyle = '#14532d'; ctx.fillRect(0, -s * 0.18, s * 1.5, s * 0.36); }
  if (e.type === 'bomb') { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, Math.PI * 2); ctx.fill(); }
  if (e.type === 'final2') { ctx.strokeStyle = '#fde047'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2); ctx.stroke(); }
  if (e.type === 'rbMoon') { ctx.save(); ctx.globalAlpha = 0.18; ctx.fillStyle = '#e879f9'; ctx.beginPath(); ctx.arc(0, 0, 190, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }   // aura que ralentiza
  if (e.type === 'final3') { ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4; ctx.beginPath(); polygon(6, s * 0.6); ctx.stroke(); ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0, 0, s * 0.2, 0, Math.PI * 2); ctx.fill(); }
  if (e.type === 'final') { ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.beginPath(); polygon(8, s * 0.6); ctx.stroke(); }
  if (def.phantom) { ctx.fillStyle = def.eye || '#0f172a'; ctx.beginPath(); ctx.arc(s * 0.35, -s * 0.3, s * 0.16, 0, Math.PI * 2); ctx.arc(s * 0.35, s * 0.3, s * 0.16, 0, Math.PI * 2); ctx.fill(); }
  if (e.type === 'shield' || e.type === 'robCeleste') {   // escudo frontal
    ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, s * 1.4, -1.3, 1.3); ctx.stroke();
  }
  if (e.shield > 0) {   // escudo del jefe: círculo azul
    ctx.globalAlpha = 0.9; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, s * 1.55, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(56,189,248,.18)'; ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.restore();
  const w = Math.max(s * 2, 22);
  bar(e.x - w / 2, e.y - s - 14, w, 5, e.hp / e.maxHp, '#ef4444');
}

// Monedas sin efectos (sin sombras ni textos) para que el juego no se ralentice con muchas
function drawCoin(c) {
  if (c.value >= 100) {            // verde: 100
    ctx.fillStyle = '#22c55e'; ctx.strokeStyle = '#bbf7d0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c.x, c.y - 16); ctx.lineTo(c.x + 13, c.y); ctx.lineTo(c.x, c.y + 16); ctx.lineTo(c.x - 13, c.y); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (c.value >= 10) {      // azul: 10
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill();
  } else {                         // amarillo: 1
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBomb(b) {
  if (b.mortar) {   // aviso del mortero del robot rosa
    ctx.fillStyle = 'rgba(239,68,68,.16)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.blast, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(239,68,68,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.blast * Math.max(0, 1 - b.t / (b.wt || 1)), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.blast, 0, Math.PI * 2); ctx.stroke();
    return;
  }
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.strokeStyle = 'rgba(239,68,68,.45)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.arc(0, 0, b.blast, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);   // zona de la explosión
  ctx.fillStyle = '#374151'; ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = Math.floor(b.t * (b.t > 1 ? 2 : 5)) % 2 === 0 ? '#ef4444' : '#7f1d1d';
  ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, b.t / 3)); ctx.stroke();   // cuenta atrás
  ctx.restore();
}

function drawBullet(b) {
  if (b.kind === 'flame') {
    const f = Math.max(0, b.life / b.maxLife);
    ctx.globalAlpha = f * 0.75;
    ctx.fillStyle = f > 0.6 ? '#fde047' : f > 0.3 ? '#fb923c' : '#ef4444';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (b.kind === 'wave') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang); ctx.lineCap = 'round'; ctx.shadowColor = '#7dd3fc'; ctx.shadowBlur = 20;
    ctx.globalAlpha = Math.min(1, b.life * 3);
    ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(-b.r * 0.6, 0, b.r * 1.5, -0.95, 0.95); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(-b.r * 0.6, 0, b.r * 1.5, -0.95, 0.95); ctx.stroke();
    ctx.restore();
  } else if (b.kind === 'disc') {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(nowS() * 18);
    ctx.fillStyle = '#e5e7eb'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
    ctx.beginPath(); star(8, b.r, b.r * 0.7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(0, 0, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    if (b.kind === 'rocket') { ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill(); }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(Z, Z);
  ctx.translate(-cam.x, -cam.y);

  // fondo: fuera del mapa más oscuro; dentro, cuadrícula
  ctx.fillStyle = '#0a0b10'; ctx.fillRect(cam.x - 20, cam.y - 20, VW + 40, VH + 40);
  ctx.fillStyle = '#12141c'; ctx.fillRect(0, 0, WW, WH);
  ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
  const x0 = Math.max(0, Math.floor(cam.x / 50) * 50), x1 = Math.min(WW, cam.x + VW + 50);
  const y0 = Math.max(0, Math.floor(cam.y / 50) * 50), y1 = Math.min(WH, cam.y + VH + 50);
  for (let x = x0; x <= x1; x += 50) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); }
  for (let y = y0; y <= y1; y += 50) { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); }
  if (WW > VW + 1 || WH > VH + 1) { ctx.strokeStyle = '#3b4466'; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WW, WH); }   // borde del mapa

  // obstáculos
  for (const b of obstacles) {
    ctx.fillStyle = '#2a3045'; ctx.strokeStyle = '#5b6585'; ctx.lineWidth = 3;
    if (b.circle) { ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    else { ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeRect(b.x, b.y, b.w, b.h); }
  }

  // fuego en el suelo
  for (const f of fires) {
    const hs = f.hostile;
    ctx.fillStyle = hs ? `rgba(220,38,38,${0.25 + 0.1 * Math.sin(nowS() * 12)})` : `rgba(249,115,22,${0.22 + 0.08 * Math.sin(nowS() * 12)})`;
    ctx.strokeStyle = hs ? 'rgba(248,113,113,.8)' : 'rgba(251,146,60,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  for (const b of bombs) drawBomb(b);
  for (const c of coins) drawCoin(c);

  // avisos: embestida y láser del Francotirador
  for (const e of enemies) {
    if (e.type === 'dash' && e.phase === 'wind') {
      ctx.strokeStyle = 'rgba(250,204,21,.35)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.dashDir.x * 190, e.y + e.dashDir.y * 190); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (e.type === 'robSword' && e.swingT > 0) {
      ctx.fillStyle = 'rgba(96,165,250,.45)'; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.arc(e.x, e.y, 125, e.swingA - 1.0, e.swingA + 1.0); ctx.closePath(); ctx.fill();
    }
    if (e.type === 'robWhite' && e.snipe === 'charge') {
      ctx.strokeStyle = `rgba(226,232,240,${0.25 + 0.5 * (1 - e.snT * 2)})`; ctx.lineWidth = 2;
      for (const s of [-1, 1]) { const a = e.lockA + s * 0.22; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(a) * 900, e.y + Math.sin(a) * 900); ctx.stroke(); }
    }
    if (e.type === 'robTank' && e.snipe === 'charge') {
      ctx.strokeStyle = 'rgba(249,115,22,.7)'; ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.lockA) * 700, e.y + Math.sin(e.lockA) * 700); ctx.stroke(); ctx.setLineDash([]);
    }
    if ((e.type === 'final' || e.type === 'final2') && e.titanState === 'wind') {
      ctx.strokeStyle = 'rgba(251,113,133,.5)'; ctx.lineWidth = 6; ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.tDir.x * 700, e.y + e.tDir.y * 700); ctx.stroke(); ctx.setLineDash([]);
    }
    if ((e.type === 'sniper' || e.type === 'ghostGray' || e.type === 'final2') && e.snipe === 'charge') {
      const p = 1 - e.snT, nb = e.type === 'final2' ? e.beams : (def_(e).beams || 1);
      ctx.strokeStyle = `rgba(244,63,94,${0.25 + 0.6 * p})`; ctx.lineWidth = 1 + 3 * p;
      for (let i = 0; i < nb; i++) {
        const a = e.lockA + (i - (nb - 1) / 2) * 0.2;
        ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(a) * 3000, e.y + Math.sin(a) * 3000); ctx.stroke();
      }
    }
  }
  for (const e of enemies) drawEnemy(e);
  for (const e of enemies) if (e.bm) {   // láseres del hexágono y de la cruz
    ctx.save(); ctx.lineCap = 'round';
    for (const a of e.bm.angs) {
      ctx.globalAlpha = e.bm.warn ? 0.45 + 0.3 * Math.sin(nowS() * 20) : 0.9;
      ctx.strokeStyle = e.bm.warn ? '#fff' : 'hsl(' + Math.floor(nowS() * 400 % 360) + ',90%,60%)'; ctx.lineWidth = e.bm.w;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(a) * 1500, e.y + Math.sin(a) * 1500); ctx.stroke();
    }
    ctx.restore();
  }
  for (const e of enemies) if (e.orbs) for (const o of e.orbs) {
    const p = orbPos(e, o);
    ctx.globalAlpha = 0.45 + 0.5 * Math.max(0, o.hp / o.max);
    ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const b of bullets) drawBullet(b);
  for (const b of ebullets) { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1, 0, Math.PI * 2); ctx.fill(); }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // explosiones y ondas
  for (const f of fx) {
    const k = f.t / f.dur;
    if (f.kind === 'boom') {
      ctx.globalAlpha = (1 - k) * 0.5; ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.stroke();
    } else if (f.kind === 'slash') {
      // el filo avanza por el arco dejando una estela que se desvanece
      const dir = f.dir || 1, sweep = Math.min(1, k / 0.45), a0 = f.a - dir * f.arc / 2, N = 22;
      const cx = f.x, cy = f.y;
      ctx.save(); ctx.lineCap = 'butt'; ctx.shadowColor = f.color; ctx.shadowBlur = 22;
      const R = f.range * (0.92 + 0.08 * Math.min(1, k * 3));
      if (f.mini) {   // ataque normal: una línea fina que se va formando
        ctx.shadowBlur = 0; ctx.lineCap = 'round';
        const fadeM = Math.max(0, 1 - Math.max(0, k - 0.35) / 0.65);
        const L = f.lines || 1;
        for (let li = 0; li < L; li++) {   // líneas contiguas paralelas (doble / triple corte)
          const RR = R + (li - (L - 1) / 2) * 13;
          for (let n = 0; n < N; n++) {
            const u0 = n / N; if (u0 > sweep) break; const e1 = Math.min((n + 1) / N, sweep);
            ctx.globalAlpha = (0.25 + 0.75 * (e1 / Math.max(sweep, 0.05))) * fadeM; ctx.strokeStyle = f.color === '#e0f2fe' ? '#fff' : f.color; ctx.lineWidth = 1.5 + 2.5 * (e1 / Math.max(sweep, 0.05));
            ctx.beginPath(); ctx.arc(cx, cy, RR, a0 + dir * f.arc * u0, a0 + dir * f.arc * e1, dir < 0); ctx.stroke();
          }
        }
        ctx.restore(); ctx.globalAlpha = 1; continue;
      }
      for (let n = 0; n < N; n++) {
        const u0 = n / N, u1 = (n + 1) / N; if (u0 > sweep) break;
        const e1 = Math.min(u1, sweep);
        const fade = Math.max(0, 1 - Math.max(0, k - 0.3) / 0.7);
        const body = Math.pow(u1 / Math.max(sweep, 0.05), 1.6);           // más grueso junto a la punta
        ctx.globalAlpha = Math.min(1, body + 0.15) * fade;
        ctx.strokeStyle = f.color; ctx.lineWidth = 4 + 22 * body * (1 - k * 0.5);
        ctx.beginPath(); ctx.arc(cx, cy, R, a0 + dir * f.arc * u0, a0 + dir * f.arc * e1, dir < 0); ctx.stroke();
        ctx.globalAlpha = Math.min(1, body + 0.2) * fade; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 + 7 * body * (1 - k * 0.5);
        ctx.beginPath(); ctx.arc(cx, cy, R, a0 + dir * f.arc * u0, a0 + dir * f.arc * e1, dir < 0); ctx.stroke();
      }
      if (sweep < 1) {   // punta brillante del filo con chispas
        const ah = a0 + dir * f.arc * sweep, hx = cx + Math.cos(ah) * R, hy = cy + Math.sin(ah) * R;
        ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        for (let q = 0; q < 5; q++) { const sa = ah + (Math.random() - 0.5) * 1.4, sl = 10 + Math.random() * 20; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + Math.cos(sa) * sl, hy + Math.sin(sa) * sl); ctx.stroke(); }
      }
      ctx.restore();
    } else if (f.kind === 'laser') {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = 3 + 9 * (1 - k); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
    } else {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * k, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (!state.over) {
    if (stats.weapon === 'sword' && lv_(stats.lv, 'sword_inf')) {   // aura brillante Infinito
      const tt = nowS(), g = ctx.createRadialGradient(player.x, player.y, 18, player.x, player.y, 90);
      g.addColorStop(0, 'rgba(253,230,138,0)'); g.addColorStop(0.8, 'rgba(253,230,138,0.12)'); g.addColorStop(1, 'rgba(255,255,255,0.35)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(player.x, player.y, 90, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.shadowColor = '#fde68a'; ctx.shadowBlur = 18; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(player.x, player.y, 90, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.5; ctx.setLineDash([6, 14]); ctx.lineDashOffset = -tt * 40; ctx.beginPath(); ctx.arc(player.x, player.y, 80 + Math.sin(tt * 3) * 4, 0, Math.PI * 2); ctx.stroke();
      ctx.restore(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    const blink = player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0;
    ctx.globalAlpha = blink ? 0.4 : 1;
    ctx.fillStyle = '#4cc9f0'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, CFG.playerRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    // auras de los poderes activos
    const auras = [['p_rate', '#fde047', 22], ['p_dmg', '#f87171', 27], ['p_def', '#60a5fa', 32]];
    for (const [id, col, r] of auras) {
      if (state.pw[id].t > 0) {
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(player.x, player.y, r, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    const a = lastAim, wpn = stats.weapon, ang0 = Math.atan2(a.y, a.x);
    ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
    if (wpn === 'sword' || wpn === 'saw' || wpn === 'arc') {   // armas con aspecto propio en la mano
      ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(ang0);
      if (wpn === 'sword') {   // espada básica: una katana guardada en su funda, colgando hacia atrás
        // espadas arcoíris a un costado, con la hoja hacia atrás y la empuñadura hacia delante (1, 2 o 3 según Doble / Triple corte)
        const nS = lv_(stats.lv, 'sword_triple') ? 3 : lv_(stats.lv, 'sword_double') ? 2 : 1, Rp = CFG.playerRadius;
        const L = Rp * 4.4, th = Rp * 0.32, H = Rp * 1.1;
        const cols = ['#ee1c25', '#ff8426', '#fff200', '#b5e61d', '#99d9ea', '#3f48cc', '#7a0bc0'], fr = [35, 66, 80, 94, 116, 131, 167], tot = 689;
        for (let n = 0; n < nS; n++) {
          ctx.save(); ctx.translate(Rp * 0.95, Rp * 0.9 + n * Rp * 0.62); ctx.rotate(-0.27); ctx.lineJoin = 'round';
          let cum = 0;
          for (let c = 0; c < 7; c++) { ctx.fillStyle = cols[c]; ctx.fillRect(-L + cum / tot * L, -th / 2, fr[c] / tot * L + 0.6, th); cum += fr[c]; }
          ctx.strokeStyle = '#000'; ctx.lineWidth = 1.3; ctx.strokeRect(-L, -th / 2, L, th);
          ctx.fillStyle = '#fff'; ctx.fillRect(0, -th * 0.4, H, th * 0.8); ctx.strokeRect(0, -th * 0.4, H, th * 0.8);   // empuñadura blanca
          ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(0, 0, th * 0.85, th * 2.6, 0, 0, Math.PI * 2); ctx.fill();   // guarda negra con relieve
          ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 1;
          for (let q = -2; q <= 2; q++) { ctx.beginPath(); ctx.moveTo(-th * 0.6, q * th * 0.95 - th * 0.3); ctx.lineTo(th * 0.6, q * th * 0.95 + th * 0.3); ctx.stroke(); }
          ctx.restore();
        }
      } else if (wpn === 'saw') {   // sierra: disco dentado girando en la mano
        ctx.translate(CFG.playerRadius + 12, 0); ctx.rotate(nowS() * 6);
        ctx.fillStyle = '#e5e7eb'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
        ctx.beginPath(); star(8, 17, 11); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#475569'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
      } else {   // bastón de rayos: vara con bobinas y orbe eléctrico chisporroteante
        ctx.fillStyle = '#475569'; ctx.fillRect(6, -3, 34, 6);
        ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 2;
        for (let x = 14; x <= 32; x += 9) { ctx.beginPath(); ctx.moveTo(x, -6); ctx.lineTo(x, 6); ctx.stroke(); }
        const tt = nowS(); ctx.save(); ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#e0f2fe'; ctx.beginPath(); ctx.arc(46, 0, 8 + Math.sin(tt * 14) * 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(46, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 1.5;
        for (let q = 0; q < 3; q++) { const sa = Math.random() * 6.28; ctx.beginPath(); ctx.moveTo(46, 0); ctx.lineTo(46 + Math.cos(sa) * (10 + Math.random() * 8), Math.sin(sa) * (10 + Math.random() * 8)); ctx.stroke(); }
        ctx.restore();
      }
      ctx.restore();
    } else {
    const wid = { shotgun: 8, rifle: 4, mg: 4, flame: 9, launcher: 9 }[stats.weapon] || 5;
    const len = CFG.playerRadius + (stats.weapon === 'rifle' ? 18 : 10);
    ctx.lineWidth = wid;
    ctx.beginPath();
    ctx.moveTo(player.x + a.x * 8, player.y + a.y * 8);
    ctx.lineTo(player.x + a.x * len, player.y + a.y * len);
    ctx.stroke();
    }
    if (player.cd > 0 && player.cdMax > 0.1) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, CFG.playerRadius + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - player.cd / player.cdMax));
      ctx.stroke();
    }
    bar(player.x - 22, player.y - CFG.playerRadius - 20, 44, 6, player.hp / stats.maxHp, '#4ade80');
  }
  ctx.restore();

  // HUD (en pantalla, sin zoom)
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'center';
  if (enemies.some(e => e.type === 'final' || e.type === 'final2' || e.type === 'final3' || e.type === 'final4')) ctx.fillStyle = '#fda4af';   // reloj parado durante el jefe
  ctx.fillText(state.practice ? 'PRUEBA' : fmt(state.time), W / 2, 40);
  if (state.inf) { ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#c084fc'; ctx.fillText('∞ MODO INFINITO · vida enemiga x' + state.inf.m.toFixed(2) + ' · ' + fmt(state.inf.t), W / 2, 60); }
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left'; ctx.font = '14px system-ui';
  ctx.fillText('VIDA', 20, 26);
  bar(20, 32, 220, 16, player.hp / stats.maxHp, player.hp / stats.maxHp > 0.3 ? '#4ade80' : '#ef4444');
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui';
  ctx.fillText(`${Math.ceil(player.hp)} / ${stats.maxHp}`, 28, 45);
  ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#ffd23f';
  ctx.fillText('● ' + state.coins, 20, 76);
  ctx.font = '14px system-ui'; ctx.fillStyle = '#fff';
  const ownedN = Object.keys(WEAPONS).filter(id => owns(id, stats.lv)).length;
  ctx.fillText('Arma: ' + WEAPONS[stats.weapon].name + (ownedN > 1 ? '  (Q / E para cambiar)' : ''), 20, 98);
  if (stats.weapon === 'sword') {
    const sws = WEAPONS.sword.stats(stats.lv), ms = swModes(sws);
    ctx.fillStyle = '#e0f2fe'; ctx.fillText('Ataque: ' + SW_NAMES[swMode(sws)] + (ms.length > 1 ? '  (Shift para cambiar)' : ''), 20, 118);
    if (rbActive()) { ctx.fillStyle = RB_COLS[Math.floor(nowS() * 4) % 7]; ctx.fillText('Filo arcoíris' + (lv_(stats.lv, 'sword_rb') >= 3 ? '' : ': ' + Math.ceil(state.rbT) + ' s'), 20, 138); }
  }
  ctx.textAlign = 'right'; ctx.font = '13px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText('WASD: mover · Flechas / clic: disparar · Esc: pausa', W - 20, 28);

  // calor del lanzallamas
  if (stats.weapon === 'flame' || state.heat > 0.02) {
    ctx.textAlign = 'left'; ctx.font = '14px system-ui'; ctx.fillStyle = state.locked ? '#fca5a5' : '#fff';
    ctx.fillText(state.locked ? 'SOBRECALENTADO: enfriando…' : 'CALOR', 20, 120);
    bar(20, 126, 170, 10, state.heat, state.locked ? '#6b7280' : state.heat > 0.7 ? '#ef4444' : '#fb923c');
  }
  // barra de vida del jefe
  const boss = enemies.find(e => e.type === 'final' || e.type === 'final2' || e.type === 'final3' || e.type === 'final4');
  if (boss) {
    const bw = Math.min(560, W - 60), bx = (W - bw) / 2;
    ctx.textAlign = 'center'; ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#fda4af';
    ctx.fillText(CFG.enemies[boss.type].name.toUpperCase(), W / 2, 60);
    bar(bx, 66, bw, 16, boss.hp / boss.maxHp, boss.shield > 0 ? '#38bdf8' : '#e11d48');
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.strokeRect(bx, 66, bw, 16);
  }
  try { if (localStorage.getItem('circuloArenaKeyDbg') === '1') {   // diagnóstico: teclas que registra el navegador
    const pressed = Object.keys(keys).filter(k => keys[k]).map(k => k === ' ' ? 'ESPACIO' : k.toUpperCase());
    ctx.textAlign = 'center'; ctx.font = 'bold 15px system-ui'; ctx.fillStyle = '#fde047'; ctx.fillText('Teclas detectadas: ' + (pressed.join(' + ') || '—') + (mouse.down ? ' + CLIC' : ''), W / 2, H - 14);
  } } catch (e) {}
  if (state.flash > 0) { ctx.globalAlpha = Math.min(1, state.flash / 0.8) * 0.8; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // aviso de la llegada del jefe
  if (state.banner) {
    ctx.globalAlpha = Math.min(1, state.banner.t); ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 40px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(state.banner.text, W / 2, H * 0.24);
    ctx.globalAlpha = 1;
  }
  // ulti (abajo a la izquierda)
  {
    const ux = 20, uy = H - 76, us = 64, ready = state.ult <= 0, u = ULTS[stats.weapon];
    ctx.fillStyle = 'rgba(15,18,28,.88)'; ctx.fillRect(ux, uy, us, us);
    if (!ready) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(ux, uy, us, us * Math.min(1, state.ult / state.ultTotal)); }
    ctx.strokeStyle = ready ? '#f97316' : '#475569'; ctx.lineWidth = 3; ctx.strokeRect(ux, uy, us, us);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui'; ctx.fillText('R', ux + us / 2, uy + 26);
    ctx.font = '10px system-ui'; ctx.fillStyle = ready ? '#fed7aa' : '#94a3b8'; ctx.fillText(u.name, ux + us / 2, uy + us - 7);
    if (!ready) { ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 13px system-ui'; ctx.fillText(Math.ceil(state.ult) + 's', ux + us / 2, uy + 44); }
  }
  // barra de poderes (abajo, centrada): tecla, nombre, espera restante / tiempo activo
  const ownedP = POWERS.filter(p => stats.lv[p.id]);
  if (ownedP.length) {
    const bs = 60, gap = 10, tw = ownedP.length * bs + (ownedP.length - 1) * gap, px0 = (W - tw) / 2, py = H - bs - 16;
    ownedP.forEach((p, i) => {
      const s = state.pw[p.id], x = px0 + i * (bs + gap);
      const active = s.t > 0, ready = s.cd <= 0;
      ctx.fillStyle = 'rgba(15,18,28,.88)'; ctx.fillRect(x, py, bs, bs);
      if (!ready) {
        const frac = Math.min(1, s.cd / s.total);
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x, py, bs, bs * frac);
      }
      ctx.strokeStyle = active ? '#4ade80' : ready ? '#fde047' : '#475569'; ctx.lineWidth = 3; ctx.strokeRect(x, py, bs, bs);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.fillText(p.key, x + bs / 2, py + 26);
      ctx.font = '10px system-ui'; ctx.fillStyle = ready || active ? '#fff' : '#94a3b8'; ctx.fillText(p.name, x + bs / 2, py + bs - 8);
      if (active) { ctx.fillStyle = '#4ade80'; ctx.font = 'bold 12px system-ui'; ctx.fillText(s.t.toFixed(1) + 's', x + bs / 2, py + 42); }
      else if (!ready) { ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 13px system-ui'; ctx.fillText(Math.ceil(s.cd) + 's', x + bs / 2, py + 42); }
    });
  }
}

// ============ BUCLE ============
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!inMenu && !state.over && !state.paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
start();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
